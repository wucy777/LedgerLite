<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="简账：离线优先、可加密的本地记账应用。" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efe6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141814" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>简账 · 本地记账</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3efe6;
      }
      body {
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100dvh;
      }
      .boot-splash {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        color: #2c4d39;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .boot-splash__mark {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 14px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      .boot-splash__dot {
        width: 34px;
        height: 34px;
        border: 2px solid #d8d0c1;
        border-top-color: #2c4d39;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #141814;
        }
        .boot-splash {
          color: #c0dac9;
        }
        .boot-splash__dot {
          border-color: #354035;
          border-top-color: #c0dac9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__dot {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="正在加载简账">
        <div class="boot-splash__mark">
          <div class="boot-splash__dot" aria-hidden="true"></div>
          <span>简账</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
